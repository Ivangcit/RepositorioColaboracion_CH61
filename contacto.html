<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contacto — Simple</title>
  <style>
    :root{--bg:#f7f8fb;--card:#ffffff;--accent:#4f46e5;--muted:#6b7280}
    *{box-sizing:border-box}
    body{font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; background:var(--bg); margin:0; color:#111}
    .wrap{max-width:720px;margin:48px auto;padding:20px}
    .card{background:var(--card);border-radius:12px;box-shadow:0 6px 20px rgba(16,24,40,0.06);padding:28px}
    h1{margin:0 0 8px;font-size:22px}
    p.lead{margin:0 0 18px;color:var(--muted)}
    form{display:grid;gap:12px}
    label{font-size:13px;color:#374151}
    input[type="text"], input[type="email"], input[type="tel"], textarea{
      width:100%;padding:10px;border:1px solid #e6e9ef;border-radius:8px;font-size:14px}
    textarea{min-height:120px;resize:vertical}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .actions{display:flex;gap:10px;align-items:center;margin-top:6px}
    button{background:var(--accent);color:#fff;border:0;padding:10px 14px;border-radius:10px;font-weight:600;cursor:pointer}
    button:disabled{opacity:0.6;cursor:not-allowed}
    .muted{color:var(--muted);font-size:13px}
    .success{background:#ecfdf5;border:1px solid #bbf7d0;color:#065f46;padding:10px;border-radius:8px}
    .error{background:#fff1f2;border:1px solid #fecaca;color:#991b1b;padding:10px;border-radius:8px}
    @media (max-width:560px){.row{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="card">
      <h1>Contacto</h1>
      <p class="lead">Rellena el formulario y haz clic en enviar. Esto valida en el cliente y abrirá tu cliente de correo como alternativa.</p>

      <div id="msg" style="display:none;margin-bottom:12px"></div>

      <form id="contactForm" novalidate>
        <div class="row">
          <div>
            <label for="name">Nombre</label>
            <input id="name" name="name" type="text" placeholder="Tu nombre" required />
          </div>
          <div>
            <label for="phone">Teléfono (opcional)</label>
            <input id="phone" name="phone" type="tel" placeholder="55 1234 5678" />
          </div>
        </div>

        <div>
          <label for="email">Correo electrónico</label>
          <input id="email" name="email" type="email" placeholder="correo@ejemplo.com" required />
        </div>

        <div>
          <label for="message">Mensaje</label>
          <textarea id="message" name="message" placeholder="Escribe tu mensaje" required></textarea>
        </div>

        <div class="actions">
          <button id="sendBtn" type="submit">Enviar</button>
          <div class="muted">También se abrirá tu cliente de correo si no tienes backend.</div>
        </div>
      </form>

      <!-- Instrucciones: si quieres que el formulario envíe a un servicio real, sustituye la función sendWithFetch por una llamada a tu API -->
      <script>
        const form = document.getElementById('contactForm');
        const msgBox = document.getElementById('msg');
        const sendBtn = document.getElementById('sendBtn');

        function showMessage(type, text){
          msgBox.style.display = 'block';
          msgBox.className = type === 'ok' ? 'success' : 'error';
          msgBox.textContent = text;
        }

        function validateEmail(email){
          // validación simple y segura
          return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        form.addEventListener('submit', function(e){
          e.preventDefault();
          msgBox.style.display = 'none';

          const name = form.name.value.trim();
          const email = form.email.value.trim();
          const phone = form.phone.value.trim();
          const message = form.message.value.trim();

          if(!name || !email || !message){
            showMessage('err','Por favor completa los campos obligatorios.');
            return;
          }
          if(!validateEmail(email)){
            showMessage('err','Introduce un correo válido.');
            return;
          }

          // Si tuvieras un endpoint, aquí podrías hacer fetch('/api/contact', {method:'POST', body: JSON.stringify({...})})
          // En este archivo de ejemplo abrimos el cliente de correo con mailto como alternativa.

          sendBtn.disabled = true;
          sendBtn.textContent = 'Enviando...';

          // Preparar cuerpo del correo
          const subject = encodeURIComponent('Contacto desde sitio web: ' + name);
          const bodyLines = [
            'Nombre: ' + name,
            'Email: ' + email,
            phone ? ('Teléfono: ' + phone) : null,
            '',
            'Mensaje:',
            message
          ].filter(Boolean).join('\n');
          const body = encodeURIComponent(bodyLines);

          // Intentar abrir cliente de correo
          const mailto = `mailto:?subject=${subject}&body=${body}`;
          window.location.href = mailto;

          // Mostrar mensaje de éxito breve (no garantiza envío real)
          showMessage('ok','Se ha preparado el correo en tu cliente. Si deseas enviar desde el servidor, dime y te muestro ejemplos.');

          // Restaurar botón tras unos segundos
          setTimeout(()=>{sendBtn.disabled=false;sendBtn.textContent='Enviar'},1500);
        });
      </script>
    </div>
  </main>
</body>
</html>
